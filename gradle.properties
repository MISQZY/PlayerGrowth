pluginVersion=0.1.3

# Current paper-api (26.2.build.84-stable) is only resolvable against JVM
# runtime 25+ (verified: Gradle's dependency resolution rejects it under a
# release-21 toolchain with "compatible with JVM runtime version 25 or
# newer"). Bumped from 21 to match.
javaVersion=25
shadowVersion=9.6.1

guiceVersion=7.0.0
adventureVersion=5.2.0
snakeyamlVersion=2.4

# Paper switched from the "<mcVersion>-R0.1-SNAPSHOT" scheme to
# "<mcVersion>.build.<n>-<status>" after 1.21.11; verified against
# repo.papermc.io's maven-metadata.xml (see docs/BUILD.md).
paperVersion=26.2.build.84-stable
# spigot-api kept the old "-R0.1-SNAPSHOT" scheme (unlike paper-api).
spigotVersion=26.2-R0.1-SNAPSHOT
velocityVersion=4.0.0

placeholderapiVersion=2.12.3
# Real, published Maven Central artifact (verified: repo1.maven.org resolves
# core-1.12.0.jar directly) - not FlectonePulse's Bukkit plugin jar itself,
# just its "core" module's classes, compileOnly'd so we can call its actual
# Java API instead of re-parsing its config.yml/message.yml off disk by hand.
flectonePulseVersion=1.12.0
# Not a real project dependency - core-1.12.0.jar's own classes reference
# org.apache.commons.lang3.* (Pair, Strings, StringUtils, ArrayUtils) in
# their method signatures without bundling or declaring it (FlectonePulse
# pulls it in at its own runtime via Libby, its runtime dependency
# downloader - see its published POM). javac still needs those classes
# resolvable to process @Nullable type annotations on methods this project
# never even calls (e.g. EventMetadata#sound()) the moment it references
# any FlectonePulse class whose signature touches them transitively -
# compileOnly, so it adds nothing to the shaded jar.
commonsLang3Version=3.20.0

# cloud-paper/cloud-bukkit/cloud-velocity exited beta and are GA as of 2.0.0;
# cloud-core/cloud-annotations are ahead at 2.1.0.
cloudCoreVersion=2.1.0
cloudPaperVersion=2.0.0
cloudBukkitVersion=2.0.0

h2Version=2.3.232
mysqlVersion=9.3.0
mariadbVersion=3.5.3
hikariVersion=6.3.0
