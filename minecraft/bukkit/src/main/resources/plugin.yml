name: PlayerGrowth
version: '${pluginVersion}'
main: org.misqzy.playergrowth.bukkit.PlayerGrowthPlugin
api-version: '1.20.5'
authors: [MISQZY]
description: Gradual player height/scale growth with per-gender caps and optional cross-server sync.
softdepend: [PlaceholderAPI, FlectonePulse]

permissions:
  playergrowth.height:
    description: Set your own height.
    default: true
  playergrowth.height.others:
    description: Set another player's height.
    default: op
  playergrowth.gender:
    description: Set your own gender.
    default: true
  playergrowth.gender.others:
    description: Set another player's gender.
    default: op
  playergrowth.info:
    description: View your own growth info.
    default: true
  playergrowth.info.others:
    description: View another player's growth info.
    default: op
  playergrowth.admin.reload:
    description: Reload the PlayerGrowth configuration.
    default: op
  playergrowth.help:
    description: List available PlayerGrowth commands.
    default: true
  playergrowth.update-notify:
    description: Get notified in-game when a newer PlayerGrowth version is available.
    default: op
